<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Game - SaxPlayingSpider</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        input, select {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 0.8rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            outline: none;
        }
        input:focus { border-color: var(--ps-blue); }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="../dashboard/dashboard.html" class="nav-link">Dashboard</a>
        <a href="../backlog/backlog.html" class="nav-link">Backlog</a>
        <a href="../in-progress/in-progress.html" class="nav-link">In-Progress</a>
        <a href="../platinums/platinums.html" class="nav-link">Platinumed</a>
        <a href="../input-data/input-data.html" class="nav-link">Add Game</a>
        <a href="../data/data.html" class="nav-link">Data</a>
    </nav>

    <main style="max-width: 500px; margin: 4rem auto; padding: 0 1rem;">
        <div class="glass-card">
            <h2 class="label-tiny" style="margin-bottom: 1.5rem;">Register New Game</h2>
            
            <label class="label-tiny">Game Title</label>
            <input type="text" id="title" placeholder="e.g. Elden Ring">

            <label class="label-tiny">Total Trophies</label>
            <input type="number" id="total" placeholder="50">

            <label class="label-tiny">Status</label>
            <select id="status">
                <option value="backlog">Backlog</option>
                <option value="inProgress">In-Progress</option>
            </select>

            <button onclick="addGame()" class="btn" style="width:100%; background:var(--ps-blue); color:white; padding:1rem; font-size:0.8rem;">Add to Collection</button>
        </div>
    </main>

    <script>
        const psnId = "SaxPlayingSpider";

        function addGame() {
            const title = document.getElementById('title').value;
            const total = document.getElementById('total').value;
            const status = document.getElementById('status').value;

            if(!title || !total) return alert("Fill in the fields!");

            let data = JSON.parse(localStorage.getItem(psnId)) || { backlog: [], inProgress: [], platinumed: [] };
            
            const newGame = { title, total, earned: 0 };
            data[status].push(newGame);

            localStorage.setItem(psnId, JSON.stringify(data));
            
            alert(`${title} added to ${status}!`);
            window.location.href = "../index.html"; // Back to Dashboard
        }
    </script>
</body>
</html>
