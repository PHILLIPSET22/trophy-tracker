<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - SaxPlayingSpider</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header style="text-align:center; padding: 3rem 1rem;">
        <h1 style="font-size: 3rem; font-style: italic; margin:0; letter-spacing: -2px;">TROPHY TRACKER</h1>
        <p id="header-stat" class="label-tiny" style="color: var(--ps-blue);">Syncing Collection...</p>
    </header>

    <nav class="nav-bar">
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="backlog/backlog.html" class="nav-link">Backlog</a>
        <a href="in-progress/in-progress.html" class="nav-link">In-Progress</a>
        <a href="platinums/platinums.html" class="nav-link">Platinumed</a>
        <a href="input-data/input-data.html" class="nav-link">Add Game</a>
        <a href="data/data.html" class="nav-link">Data</a>
    </nav>

    <div style="max-width: 1100px; margin: 2rem auto; padding: 0 1rem;">
        <div id="stats-counters" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-bottom: 3rem;"></div>
        
        <div id="activity-ticker" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;"></div>
    </div>

    <script>
        const psnId = "SaxPlayingSpider";
        function updateDashboard() {
            const data = JSON.parse(localStorage.getItem(psnId)) || { backlog: [], inProgress: [], platinumed: [] };
            
            const allGames = [...data.backlog, ...data.inProgress, ...data.platinumed];
            const globalEarned = allGames.reduce((sum, g) => sum + Number(g.earned || 0), 0);
            const globalTotal = allGames.reduce((sum, g) => sum + Number(g.total || 0), 0);

            document.getElementById('header-stat').innerText = `SYSTEM STATUS: ${globalEarned} / ${globalTotal} TROPHIES COLLECTED`;

            // Data for bottom cards
            const lastB = data.backlog?.slice(-1)[0] || { title: "None", total: 0 };
            const lastP = data.inProgress?.[0] || { title: "None", earned: 0, total: 0 };
            const lastPlat = data.platinumed?.sort((a,b) => (b.dateCompleted || 0) - (a.dateCompleted || 0))[0] || { title: "None", earned: 0, total: 0 };

            // BOTTOM TICKER
            document.getElementById('activity-ticker').innerHTML = `
                <div class="glass-card">
                    <p class="label-tiny">Latest Backlog</p>
                    <p class="game-title">${lastB.title}</p>
                    <p class="label-tiny" style="margin-top:5px; opacity:0.6;">0 / ${lastB.total} Trophies</p>
                </div>
                <div class="glass-card" style="border-top: 2px solid var(--ps-blue);">
                    <p class="label-tiny" style="color: var(--ps-blue);">Current Grind</p>
                    <p class="game-title">${lastP.title}</p>
                    <p class="label-tiny" style="margin-top:5px; color:white;">${lastP.earned} / ${lastP.total} Trophies</p>
                </div>
                <div class="glass-card" style="border-top: 2px solid var(--ps-gold);">
                    <p class="label-tiny" style="color: var(--ps-gold);">Recent Legend</p>
                    <p class="game-title" style="color: var(--ps-gold);">${lastPlat.title}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                        <p class="label-tiny" style="color:white;">${lastPlat.earned} / ${lastPlat.total}</p>
                        <p class="date-text" style="font-size:0.6rem;">${lastPlat.dateCompleted ? new Date(lastPlat.dateCompleted).toLocaleDateString() : ''}</p>
                    </div>
                </div>
            `;
            // TOP COUNTERS
            document.getElementById('stats-counters').innerHTML = `
                <div class="glass-card" style="text-align:center; padding: 2rem;">
                    <p class="label-tiny">Total Library Trophies</p>
                    <p style="font-size: 2.5rem; font-weight: 900; font-style: italic; margin:0;">${globalEarned} / ${globalTotal}</p>
                </div>
                <div class="glass-card" style="text-align:center; padding: 2rem;">
                    <p class="label-tiny">Games In-Progress</p>
                    <p style="font-size: 3rem; font-weight: 900; font-style: italic; margin:0; color: var(--ps-blue);">${data.inProgress.length}</p>
                </div>
                <div class="glass-card" style="text-align:center; padding: 2rem;">
                    <p class="label-tiny">Total Platinums</p>
                    <p style="font-size: 3rem; font-weight: 900; font-style: italic; margin:0; color: var(--ps-gold);">${data.platinumed.length}</p>
                </div>
            `;
        }
        updateDashboard();
    </script>
</body>
</html>
