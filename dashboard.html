<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - SaxPlayingSpider</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header style="text-align:center; padding: 3rem 1rem;">
        <h1 style="font-size: 3rem; font-style: italic; margin:0;">TROPHY TRACKER</h1>
        <p id="platinum-count" class="label-tiny" style="color: var(--ps-blue);">Syncing Collection...</p>
    </header>

    <nav class="nav-bar">
        <a href="../dashboard/dashboard.html" class="nav-link">Dashboard</a>
        <a href="../backlog/backlog.html" class="nav-link">Backlog</a>
        <a href="../in-progress/in-progress.html" class="nav-link">In-Progress</a>
        <a href="../platinums/platinums.html" class="nav-link">Platinumed</a>
        <a href="../input-data/input-data.html" class="nav-link">Add Game</a>
        <a href="../data/data.html" class="nav-link">Data</a>
    </nav>

    <div style="max-width: 1100px; margin: 2rem auto; padding: 0 1rem;">
        <div id="activity-ticker" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 3rem;"></div>
        
        <div id="stats-counters" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem;"></div>
    </div>

    <script>
        const psnId = "SaxPlayingSpider";
        function updateDashboard() {
            const data = JSON.parse(localStorage.getItem(psnId)) || { backlog: [], inProgress: [], platinumed: [] };
            
            // Logic for finding latest games
            const lastB = data.backlog?.slice(-1)[0] || { title: "Empty" };
            const lastP = data.inProgress?.[0] || { title: "None", earned: 0, total: 1 };
            const lastPlat = data.platinumed?.slice(-1)[0] || { title: "None" };

            document.getElementById('platinum-count').innerText = `${data.platinumed.length} PLATINUMS COLLECTED`;

            document.getElementById('activity-ticker').innerHTML = `
                <div class="glass-card">
                    <p class="label-tiny">Newest Addition</p>
                    <p class="game-title">${lastB.title}</p>
                </div>
                <div class="glass-card" style="border-top: 2px solid var(--ps-blue);">
                    <p class="label-tiny" style="color: var(--ps-blue);">Current Grind</p>
                    <p class="game-title">${lastP.title}</p>
                    <p class="label-tiny" style="margin-top:5px;">${Math.round(lastP.earned/lastP.total*100) || 0}% Complete</p>
                </div>
                <div class="glass-card" style="border-top: 2px solid var(--ps-gold);">
                    <p class="label-tiny" style="color: var(--ps-gold);">Recent Legend</p>
                    <p class="game-title" style="color: var(--ps-gold);">${lastPlat.title}</p>
                </div>
            `;

            const total = data.backlog.length + data.inProgress.length + data.platinumed.length;
            document.getElementById('stats-counters').innerHTML = `
                <div class="glass-card" style="text-align:center; padding: 3rem;">
                    <p class="label-tiny">Total Library</p>
                    <p style="font-size: 4rem; font-weight: 900; font-style: italic; margin:0;">${total}</p>
                </div>
                <div class="glass-card" style="text-align:center; padding: 3rem;">
                    <p class="label-tiny">In Progress</p>
                    <p style="font-size: 4rem; font-weight: 900; font-style: italic; margin:0; color: var(--ps-blue);">${data.inProgress.length}</p>
                </div>
                <div class="glass-card" style="text-align:center; padding: 3rem;">
                    <p class="label-tiny">Backlog</p>
                    <p style="font-size: 4rem; font-weight: 900; font-style: italic; margin:0; color: #555;">${data.backlog.length}</p>
                </div>
            `;
        }
        updateDashboard();
    </script>
</body>
</html>
