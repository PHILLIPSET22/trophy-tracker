<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - SaxPlayingSpider</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header style="text-align:center; padding: 3rem 1rem;">
        <h1 style="font-size: 3rem; font-style: italic; margin:0; letter-spacing: -2px;">TROPHY TRACKER</h1>
        <p id="header-stat" class="label-tiny" style="color: var(--ps-blue);">Syncing Collection...</p>
    </header>

    <nav class="nav-bar">
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="backlog/physical-backlog.html" class="nav-link">Physical</a>
        <a href="backlog/digital-backlog.html" class="nav-link">Digital</a>
        <a href="in-progress/in-progress.html" class="nav-link">In-Progress</a>
        <a href="platinums/platinums.html" class="nav-link">Platinumed</a>
        <a href="input-data/input-data.html" class="nav-link">Add Game</a>
        <a href="data/data.html" class="nav-link">Data</a>
    </nav>

    <div style="max-width: 1100px; margin: 2rem auto; padding: 0 1rem;">
        
        <h2 class="label-tiny" style="margin-bottom: 1rem; opacity: 0.8;">Latest Activity</h2>
        <div id="activity-ticker" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 4rem;"></div>
        
        <h2 class="label-tiny" style="margin-bottom: 1rem; opacity: 0.8;">Collection Summary</h2>
        <div id="stats-counters" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem;"></div>
    </div>

    <script>
        const psnId = "SaxPlayingSpider";

        function updateDashboard() {
            let data = JSON.parse(localStorage.getItem(psnId)) || { 
                physicalBacklog: [], 
                digitalBacklog: [], 
                inProgress: [], 
                platinumed: [] 
            };

            // --- DATA MIGRATION CHECK ---
            // If user has old 'backlog' data, move it to digitalBacklog automatically
            if (data.backlog) {
                data.digitalBacklog = [...(data.digitalBacklog || []), ...data.backlog];
                delete data.backlog;
                localStorage.setItem(psnId, JSON.stringify(data));
            }

            // Calculate Global Trophy Totals
            const allGames = [
                ...(data.physicalBacklog || []), 
                ...(data.digitalBacklog || []), 
                ...data.inProgress, 
                ...data.platinumed
            ];
            const globalEarned = allGames.reduce((sum, g) => sum + Number(g.earned || 0), 0);
            const globalTotal = allGames.reduce((sum, g) => sum + Number(g.total || 0), 0);

            document.getElementById('header-stat').innerText = `${data.platinumed.length} Games Platinumed!`;

            // Identify Latest Entries (by dateAdded timestamp, not array position)
            const lastPhys = (data.physicalBacklog?.length > 0) 
                ? data.physicalBacklog.reduce((latest, game) => {
                    const gameDate = new Date(game.dateAdded || 0).getTime();
                    const latestDate = new Date(latest.dateAdded || 0).getTime();
                    return gameDate > latestDate ? game : latest;
                  })
                : { title: "None", total: 0 };
            const lastDigi = (data.digitalBacklog?.length > 0)
                ? data.digitalBacklog.reduce((latest, game) => {
                    const gameDate = new Date(game.dateAdded || 0).getTime();
                    const latestDate = new Date(latest.dateAdded || 0).getTime();
                    return gameDate > latestDate ? game : latest;
                  })
                : { title: "None", total: 0 };
            const lastP = data.inProgress?.[0] || { title: "None", earned: 0, total: 0 };
            const lastPlat = data.platinumed?.sort((a,b) => new Date(b.dateCompleted) - new Date(a.dateCompleted))[0] || { title: "None", earned: 0, total: 0 };

            // BUILD LIVE FEED (Top Section)
            document.getElementById('activity-ticker').innerHTML = `
                <div class="glass-card">
                    <p class="label-tiny">Latest Physical Disc</p>
                    <p class="game-title">${lastPhys.title}</p>
                    <p class="label-tiny" style="margin-top:5px; opacity:0.6;">0 / ${lastPhys.total} Trophies</p>
                </div>
                <div class="glass-card">
                    <p class="label-tiny">Latest Digital Add</p>
                    <p class="game-title">${lastDigi.title}</p>
                    <p class="label-tiny" style="margin-top:5px; opacity:0.6;">0 / ${lastDigi.total} Trophies</p>
                </div>
                <div class="glass-card" style="border-top: 2px solid var(--ps-blue);">
                    <p class="label-tiny" style="color: var(--ps-blue);">Last Played</p>
                    <p class="game-title">${lastP.title}</p>
                    <p class="label-tiny" style="margin-top:5px; color:white;">${lastP.earned} / ${lastP.total} Trophies</p>
                </div>
                <div class="glass-card" style="border-top: 2px solid var(--ps-gold);">
                    <p class="label-tiny" style="color: var(--ps-gold);">Latest Platinum</p>
                    <p class="game-title" style="color: var(--ps-gold);">${lastPlat.title}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                        <p class="label-tiny" style="color:white;">${lastPlat.earned} / ${lastPlat.total} Trophies</p>
                        <p class="date-text" style="font-size:0.6rem;">${lastPlat.dateCompleted || ''}</p>
                    </div>
                </div>
            `;

            // BUILD GLOBAL STATS (Bottom Section)
            document.getElementById('stats-counters').innerHTML = `
                <div class="glass-card" style="text-align:center;">
                    <p class="label-tiny">Physical Backlog</p>
                    <p style="font-size: 2.5rem; font-weight: 900; margin:0;">${data.physicalBacklog?.length || 0}</p>
                </div>
                <div class="glass-card" style="text-align:center;">
                    <p class="label-tiny">Digital Backlog</p>
                    <p style="font-size: 2.5rem; font-weight: 900; margin:0;">${data.digitalBacklog?.length || 0}</p>
                </div>
                <div class="glass-card" style="text-align:center;">
                    <p class="label-tiny">In-Progress</p>
                    <p style="font-size: 2.5rem; font-weight: 900; margin:0; color: var(--ps-blue);">${data.inProgress.length}</p>
                </div>
                <div class="glass-card" style="text-align:center;">
                    <p class="label-tiny">Platinumed</p>
                    <p style="font-size: 2.5rem; font-weight: 900; margin:0; color: var(--ps-gold);">${data.platinumed.length}</p>
                </div>
                <div class="glass-card" style="text-align:center; grid-column: 1 / -1;">
                    <p class="label-tiny">Total Trophy Count</p>
                    <p style="font-size: 2rem; font-weight: 900; font-style: italic; margin:0;">${globalEarned} / ${globalTotal}</p>
                </div>
            `;
        }
        updateDashboard();
    </script>
</body>
</html>
