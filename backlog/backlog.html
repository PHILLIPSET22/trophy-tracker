<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backlog - SaxPlayingSpider</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="nav-bar">
        <a href="../dashboard.html" class="nav-link">Dashboard</a>
        <a href="backlog.html" class="nav-link active">Backlog</a>
        <a href="../in-progress/in-progress.html" class="nav-link">In-Progress</a>
        <a href="../platinums/platinums.html" class="nav-link">Platinumed</a>
        <a href="../input-data/input-data.html" class="nav-link">Add Game</a>
        <a href="../data/data.html" class="nav-link">Data</a>
    </nav>

    <main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
        <h2 class="label-tiny">Unplayed Collection</h2>
        <div id="backlogContainer"></div>
    </main>

    <script>
        const psnId = "SaxPlayingSpider";
        function displayBacklog() {
            const data = JSON.parse(localStorage.getItem(psnId)) || { backlog: [] };
            const container = document.getElementById('backlogContainer');
            container.innerHTML = "";

            data.backlog.forEach((game, index) => {
                const div = document.createElement('div');
                div.className = 'glass-card';
                div.style.marginBottom = "1rem";
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <p class="game-title">${game.title}</p>
                            <p class="label-tiny" style="margin:0; opacity:0.6;"> 0 / ${game.total} Trophies</p>
                        </div>
                        <button onclick="start(${index})" class="btn btn-update" style="background:var(--ps-blue); color:white;">Start Game</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.start = i => {
            let data = JSON.parse(localStorage.getItem(psnId));
            const game = data.backlog.splice(i, 1)[0];
            if(!data.inProgress) data.inProgress = [];
            data.inProgress.unshift(game);
            localStorage.setItem(psnId, JSON.stringify(data));
            displayBacklog();
        };
        displayBacklog();
    </script>
</body>
</html>
