<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>In-Progress - SaxPlayingSpider</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="nav-bar">
        <a href="../dashboard.html" class="nav-link">Dashboard</a>
        <a href="../backlog/backlog.html" class="nav-link">Backlog</a>
        <a href="in-progress.html" class="nav-link active">In-Progress</a>
        <a href="../platinums/platinums.html" class="nav-link">Platinumed</a>
        <a href="../input-data/input-data.html" class="nav-link">Add Game</a>
        <a href="../data/data.html" class="nav-link">Data</a>
    </nav>

    <main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
        <h2 class="label-tiny">Current Grinds</h2>
        <div id="progressContainer"></div>
    </main>

    <script>
        const psnId = "SaxPlayingSpider";

        function displayProgress() {
            const data = JSON.parse(localStorage.getItem(psnId)) || { inProgress: [] };
            const container = document.getElementById('progressContainer');
            container.innerHTML = "";

            if (data.inProgress.length === 0) {
                container.innerHTML = `<p class="label-tiny" style="text-align:center; opacity:0.5; margin-top: 3rem;">No active grinds.</p>`;
                return;
            }

            data.inProgress.forEach((game, index) => {
                const div = document.createElement('div');
                div.className = 'glass-card';
                div.style.marginBottom = "1.5rem";
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <p class="game-title">${game.title}</p>
                        <p class="label-tiny" style="color:white; margin:0;">${game.earned} / ${game.total} Trophies</p>
                    </div>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button onclick="updateCount(${index})" class="btn btn-update">Update Count</button>
                        <button onclick="moveToPlatinum(${index})" class="btn" style="background:var(--ps-gold); color:black; font-weight:bold; font-size:0.7rem; border-radius:4px; padding:0.5rem 1rem;">Move to Platinum</button>
                        <button onclick="deleteGame(${index})" class="btn" style="background:rgba(255, 50, 50, 0.2); color:#ff9999; border: 1px solid rgba(255, 50, 50, 0.3); font-size:0.7rem; border-radius:4px; padding:0.5rem 1rem;">Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.updateCount = i => {
            let data = JSON.parse(localStorage.getItem(psnId));
            const newEarned = prompt(`Update trophies earned for ${data.inProgress[i].title}:`, data.inProgress[i].earned);
            const newTotal = prompt(`Update total trophies for ${data.inProgress[i].title}:`, data.inProgress[i].total);
            
            if (newEarned !== null && newTotal !== null) {
                data.inProgress[i].earned = newEarned;
                data.inProgress[i].total = newTotal;
                localStorage.setItem(psnId, JSON.stringify(data));
                displayProgress();
            }
        };

        window.moveToPlatinum = i => {
            let data = JSON.parse(localStorage.getItem(psnId));
            
            const finishedGame = data.inProgress.splice(i, 1)[0];
            finishedGame.dateCompleted = new Date().toISOString().split('T')[0];
            
            if(!data.platinumed) data.platinumed = [];
            data.platinumed.push(finishedGame);
            
            localStorage.setItem(psnId, JSON.stringify(data));
            displayProgress();
            alert(`${finishedGame.title} moved to Platinumed page!`);
        };

        window.deleteGame = i => {
            let data = JSON.parse(localStorage.getItem(psnId));
            const gameTitle = data.inProgress[i].title;

            if (confirm(`Are you sure you want to delete ${gameTitle}? This cannot be undone.`)) {
                data.inProgress.splice(i, 1);
                localStorage.setItem(psnId, JSON.stringify(data));
                displayProgress();
            }
        };

        displayProgress();
    </script>
</body>
</html>
