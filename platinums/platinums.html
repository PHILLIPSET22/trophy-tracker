<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Platinumed - SaxPlayingSpider</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="nav-bar">
        <a href="../index.html" class="nav-link">Dashboard</a>
        <a href="../backlog/backlog.html" class="nav-link">Backlog</a>
        <a href="../in-progress/in-progress.html" class="nav-link">In-Progress</a>
        <a href="platinums.html" class="nav-link active">Platinumed</a>
        <a href="../input-data/input-data.html" class="nav-link">Add Game</a>
    </nav>

    <main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
        <h2 class="label-tiny" style="margin-bottom: 2rem; color: var(--ps-gold);">🏆 Platinum Collection</h2>
        <div id="platinumContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;"></div>
    </main>

    <script>
        const psnId = "SaxPlayingSpider";

        function displayPlats() {
            const data = JSON.parse(localStorage.getItem(psnId)) || { platinumed: [] };
            const container = document.getElementById('platinumContainer');
            container.innerHTML = "";

            data.platinumed.forEach(game => {
                const div = document.createElement('div');
                div.className = 'glass-card';
                div.style.borderLeft = "4px solid var(--ps-gold)";
                div.innerHTML = `
                    <p class="label-tiny" style="color:var(--ps-gold);">100% COMPLETED</p>
                    <p class="game-title" style="color:var(--ps-gold);">${game.title}</p>
                    <p class="label-tiny">${game.total} Trophies Total</p>
                `;
                container.appendChild(div);
            });
        }
        displayPlats();
    </script>
</body>
</html>
