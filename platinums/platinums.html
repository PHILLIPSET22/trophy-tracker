<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Platinumed - SaxPlayingSpider</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="nav-bar">
        <a href="../dashboard.html" class="nav-link">Dashboard</a>
        <a href="../backlog/physical-backlog.html" class="nav-link">Physical</a>
        <a href="../backlog/digital-backlog.html" class="nav-link">Digital</a>
        <a href="../in-progress/in-progress.html" class="nav-link">In-Progress</a>
        <a href="../platinums/platinums.html" class="nav-link">Platinumed</a>
        <a href="../input-data/input-data.html" class="nav-link">Add Game</a>
        <a href="../data/data.html" class="nav-link">Data</a>
    </nav>
    
    <main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2 class="label-tiny" style="margin:0; color: var(--ps-gold);">🏆 Platinum Collection</h2>
            <button onclick="toggleSort()" id="sortBtn" class="btn btn-update" style="font-size:0.6rem;">Sort: Newest First</button>
        </div>
        <div id="platinumContainer"></div>
    </main>

    <script>
        const psnId = "SaxPlayingSpider";
        let sortNewest = true;

        function toggleSort() {
            sortNewest = !sortNewest;
            document.getElementById('sortBtn').innerText = sortNewest ? "Sort: Newest First" : "Sort: Oldest First";
            displayPlats();
        }

        function displayPlats() {
            const data = JSON.parse(localStorage.getItem(psnId)) || { platinumed: [] };
            const container = document.getElementById('platinumContainer');
            container.innerHTML = "";

            const sorted = [...data.platinumed].sort((a, b) => {
                const dateA = new Date(a.dateCompleted).getTime() || 0;
                const dateB = new Date(b.dateCompleted).getTime() || 0;
                return sortNewest ? (dateB - dateA) : (dateA - dateB);
            });

            sorted.forEach((game) => {
                const originalIndex = data.platinumed.findIndex(g => g === game);
                
                // --- ADDED: Storage Logic ---
                const storage = game.storageType || "Digital";

                const div = document.createElement('div');
                div.className = 'glass-card';
                div.style.marginBottom = "1rem";
                div.style.borderLeft = "4px solid var(--ps-gold)";
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <span class="label-tiny" style="border: 1px solid var(--ps-gold); color: var(--ps-gold); padding: 1px 5px; border-radius: 3px; font-size: 0.5rem; vertical-align: middle; margin-right: 5px;">${storage.toUpperCase()}</span>
                            <p class="game-title" style="color:var(--ps-gold); margin-bottom: 5px; display: inline-block; vertical-align: middle;">${game.title}</p>
                            <p class="date-text" style="font-size:0.7rem; opacity:0.6;">Platinumed On: ${game.dateCompleted || 'N/A'}</p>
                        </div>
                        <div style="text-align: right;">
                            <p class="label-tiny" style="color:white; margin:0 0 10px 0; font-size:0.9rem;">${game.earned} / ${game.total} Trophies</p>
                            <div style="display: flex; gap: 5px; justify-content: flex-end;">
                                <button onclick="editPlatStats(${originalIndex})" class="btn" style="font-size: 0.6rem; padding: 4px 8px; background: rgba(255,255,255,0.1);">Edit Stats</button>
                                <button onclick="deletePlat(${originalIndex})" class="btn" style="font-size: 0.6rem; padding: 4px 8px; background: rgba(255, 50, 50, 0.2); color: #ff9999; border: 1px solid rgba(255, 50, 50, 0.3);">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.editPlatStats = (i) => {
            let data = JSON.parse(localStorage.getItem(psnId));
            const game = data.platinumed[i];
            
            const newEarned = prompt(`Update trophies earned:`, game.earned);
            const newTotal = prompt(`Update total trophies:`, game.total);
            const newDate = prompt(`Update completion date (YYYY-MM-DD):`, game.dateCompleted);
            const newStorage = prompt(`Update Storage Type (Physical/Digital):`, game.storageType || "Digital");

            if (newEarned !== null && newTotal !== null && newDate !== null && newStorage !== null) {
                data.platinumed[i].earned = newEarned;
                data.platinumed[i].total = newTotal;
                data.platinumed[i].dateCompleted = newDate;
                data.platinumed[i].storageType = newStorage;
                localStorage.setItem(psnId, JSON.stringify(data));
                displayPlats();
            }
        };

        window.deletePlat = (i) => {
            let data = JSON.parse(localStorage.getItem(psnId));
            const gameTitle = data.platinumed[i].title;
            
            if (confirm(`Are you sure you want to delete ${gameTitle} from your Platinum collection?`)) {
                data.platinumed.splice(i, 1);
                localStorage.setItem(psnId, JSON.stringify(data));
                displayPlats();
            }
        };

        displayPlats();
    </script>
</body>
</html>
